<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --text: #1a1a1a; --text-2: #555; --text-3: #888; --line: #e5e5e5; --link: #1f5fbf;
  --ph-bg: #ececea;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --row: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151515; --text: #e8e8e6; --text-2: #b0b0ab; --text-3: #85847f; --line: #2c2c2a; --link: #6aa5f0;
    --ph-bg: #222220;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151515; --text: #e8e8e6; --text-2: #b0b0ab; --text-3: #85847f; --line: #2c2c2a; --link: #6aa5f0;
  --ph-bg: #222220;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
main { max-width: 1600px; margin: 0 auto; padding: 48px 24px 80px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; max-width: 820px; margin-bottom: 28px; }
h1 { font-size: 26px; margin: 0; font-weight: 600; }
.role { color: var(--text-2); margin: 2px 0 0; }
.role a { font: 14px var(--mono); }
#theme { background: none; border: 1px solid var(--line); color: var(--text-3); border-radius: 4px; padding: 2px 8px; font: 13px var(--mono); cursor: pointer; }

/* Justified rows: each tile grows in proportion to its aspect ratio, so every
   tile in a row ends up the same height. No JS layout, no reflow. */
.gallery { display: flex; flex-wrap: wrap; gap: 8px; }
.gallery::after { content: ""; flex-grow: 1e4; }          /* keep last row from stretching */
.gallery a {
  position: relative; display: block; overflow: hidden;
  flex: var(--r) 1 calc(var(--r) * var(--row));
  aspect-ratio: var(--r);
  background: var(--ph-bg); cursor: zoom-in;
}
/* blur-up placeholder: a 24px thumbnail inlined in the HTML, blurred */
.gallery a::before {
  content: ""; position: absolute; inset: -16px;
  background: var(--ph) center / cover no-repeat; filter: blur(14px);
}
.gallery img {
  position: relative; display: block; width: 100%; height: 100%; object-fit: cover;
  transition: opacity .5s ease, transform .4s ease;
}
.js .gallery img { opacity: 0; }
.js .gallery img.in { opacity: 1; }
.gallery a:hover img.in { transform: scale(1.015); }
.gallery a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* lightbox */
dialog#lb { position: fixed; inset: 0; width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #0b0b0b; color: #ddd; overscroll-behavior: contain; }
dialog#lb::backdrop { background: transparent; }
#lb figure { margin: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 56px 16px; }
#lb .stage { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
#lb img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity .25s ease; background: var(--lb-ph) center / contain no-repeat; }
#lb figcaption { font: 12px var(--mono); color: #888; padding-top: 10px; min-height: 28px; }
#lb button { position: absolute; background: none; border: 0; color: #bbb; font: 28px/1 var(--sans); cursor: pointer; padding: 12px 14px; }
#lb button:hover, #lb button:focus-visible { color: #fff; }
#lb .x { top: 4px; right: 8px; }
#lb .prev { left: 4px; top: 50%; transform: translateY(-50%); }
#lb .next { right: 4px; top: 50%; transform: translateY(-50%); }
#lb .count { position: absolute; top: 16px; left: 20px; font: 12px var(--mono); color: #777; }

footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--text-3); max-width: 820px; }
@media (max-width: 600px) {
  :root { --row: 180px; }
  main { padding: 32px 16px 64px; }
  .gallery { gap: 4px; }
  #lb figure { padding: 48px 0 12px; }
  #lb .prev, #lb .next { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .gallery img, #lb img { transition: none; }
  .gallery a:hover img.in { transform: none; }
}
</style>

<script>
// theme toggle (same behaviour and storage key as the homepage)
(function () {
  var root = document.documentElement;
  document.getElementById("theme").addEventListener("click", function () {
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });
})();

// Justified rows. CSS alone (flex-grow by aspect ratio) lets a photo that is alone
// in its row stretch to full width; here we pack rows so each is close to the
// target height, then size tiles explicitly. CSS layout stays as the no-JS fallback.
(function () {
  var g = document.getElementById("gallery"), tiles = Array.prototype.slice.call(g.children);
  var ratios = tiles.map(function (a) { return parseFloat(a.style.getPropertyValue("--r")); });
  var lastW = 0;
  function layout() {
    var W = g.clientWidth; if (!W || W === lastW) return; lastW = W;
    var cs = getComputedStyle(g), gap = parseFloat(cs.columnGap) || 0,
        H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row")) || 300;
    function rowH(a, b) { var s = 0; for (var k = a; k < b; k++) s += ratios[k]; return (W - gap * (b - a - 1)) / s; }
    var start = 0;
    while (start < tiles.length) {
      var end = start + 1;
      while (end < tiles.length && rowH(start, end) > H) end++;
      var h = rowH(start, end), last = end === tiles.length && h > H;
      // compare with the row one photo shorter, keep whichever is nearer the target
      if (!last && end - start > 1) {
        var h2 = rowH(start, end - 1);
        if (Math.abs(Math.log(h2 / H)) < Math.abs(Math.log(h / H))) { end--; h = h2; }
      }
      if (last) h = H;
      for (var k = start; k < end; k++) {
        var s = tiles[k].style;
        s.flex = "none"; s.width = (ratios[k] * h).toFixed(2) + "px"; s.height = h.toFixed(2) + "px";
      }
      // absorb sub-pixel rounding on the last tile so rows end flush
      if (!last) tiles[end - 1].style.width = "calc(" + tiles[end - 1].style.width + " - 0.5px)";
      start = end;
    }
  }
  layout();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(g);
  else addEventListener("resize", layout);
})();

// fade each photo in over its blurred placeholder once it has decoded
(function () {
  document.querySelectorAll(".gallery img").forEach(function (img) {
    function show() { img.classList.add("in"); }
    if (img.complete && img.naturalWidth) show();
    else { img.addEventListener("load", show); img.addEventListener("error", show); }
  });
})();

// lightbox
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll(".gallery a"));
  var dlg = document.getElementById("lb"), img = document.getElementById("lbImg"),
      cap = document.getElementById("lbCap"), count = document.getElementById("lbCount");
  if (!dlg.showModal) return;                  // very old browsers: links open the full image
  var cur = 0;

  function sizesFor(a) {                       // displayed width when fit to the viewport
    var r = parseFloat(a.style.getPropertyValue("--r"));
    return "min(100vw, " + Math.round(r * 90) + "vh)";
  }
  function preload(i) {
    var a = links[(i + links.length) % links.length], t = a.querySelector("img"), p = new Image();
    p.sizes = sizesFor(a); p.srcset = t.srcset; p.src = a.href;
  }
  function show(i) {
    cur = (i + links.length) % links.length;
    var a = links[cur], t = a.querySelector("img");
    // show the already-loaded thumbnail immediately, then swap in the sharp version
    img.style.setProperty("--lb-ph", "url(" + (t.currentSrc || t.src) + ")");
    img.removeAttribute("srcset"); img.src = "";
    img.sizes = sizesFor(a); img.srcset = t.srcset; img.src = a.href;
    img.alt = t.alt;
    cap.textContent = a.dataset.cap || "";
    count.textContent = (cur + 1) + " / " + links.length;
    preload(cur + 1); preload(cur - 1);
  }
  links.forEach(function (a, i) {
    a.addEventListener("click", function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault(); show(i); dlg.showModal();
    });
  });
  dlg.querySelector(".prev").onclick = function () { show(cur - 1); };
  dlg.querySelector(".next").onclick = function () { show(cur + 1); };
  dlg.querySelector(".x").onclick = function () { dlg.close(); };
  dlg.addEventListener("close", function () { links[cur].focus({ preventScroll: true }); links[cur].scrollIntoView({ block: "nearest" }); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.classList.contains("stage") || e.target.tagName === "FIGURE") dlg.close(); });
  document.addEventListener("keydown", function (e) {
    if (!dlg.open) return;
    if (e.key === "ArrowRight") show(cur + 1);
    else if (e.key === "ArrowLeft") show(cur - 1);
  });
  // swipe
  var x0 = null, y0 = null;
  dlg.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  dlg.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
    else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) dlg.close();
    x0 = null;
  });
})();
</script>
</body>
</html>
